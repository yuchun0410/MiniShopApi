spring.application.name=MiniShopApi

# 資料庫連線：改用環境變數帶入，Render 部署時只要設定這幾個環境變數就好，
# 本機開發沒有設環境變數時，會自動 fallback 用冒號後面的預設值（也就是你原本本機 MySQL 的設定）。
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mini_shop?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Taipei}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080
# log 等級：預設 INFO，自己的 package 想看更細可以設 DEBUG
logging.level.root=INFO
logging.level.com.example.demo=DEBUG

# 同時輸出到檔案，方便主管/之後除錯時查歷史紀錄
logging.file.name=logs/mini-shop.log
logging.level.org.springframework.security=DEBUG

mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# CORS 允許的前端來源：本機開發預設是 Vite 的 http://localhost:5173，
# 部署到 Render 之後，用環境變數 CORS_ALLOWED_ORIGIN 蓋成你的 Vercel 網址即可，
# 如果要同時允許多個來源，用逗號分隔，例如 http://localhost:5173,https://xxx.vercel.app
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

# Session Cookie 設定：本機是 http，SameSite 用 lax、Secure 關掉才能正常登入；
# 部署到雲端後前後端不同網域，且都是 https，這時用環境變數把這兩個蓋成 none / true，
# 瀏覽器才會願意在跨網域請求時把 cookie 帶上。
server.servlet.session.cookie.same-site=${COOKIE_SAME_SITE:lax}
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# 以下 Session Cookie 設定，改用 JWT 後已不再生效（SecurityConfig 設定為 STATELESS，
# 不會再建立 Session），先保留這幾行做紀錄，不刪除，方便之後需要回退比對。

# JWT 設定：本機開發用預設值即可跑，正式部署時務必用環境變數 JWT_SECRET 蓋成一組夠長、
# 夠隨機的字串（至少 32 bytes，因為 HMAC-SHA256 對金鑰長度有最低要求，太短會直接噴例外）。
# 原本是 HMAC（對稱式）用的單一密鑰，改成 RSA（非對稱式）後不再使用，保留這行做紀錄。
# app.jwt.secret=${JWT_SECRET:dev-only-jwt-secret-please-change-before-deploying-32bytes-min}

# RSA 金鑰對（非對稱式簽章）：private key 簽發 token、public key 驗證 token。
# 這裡預設值是專門產生給本機開發用的一組 2048-bit RSA 金鑰（DER 格式 + Base64），
# 正式部署時務必用環境變數換成自己重新產生的一組，private key 絕對不能外流。
app.jwt.private-key=${JWT_PRIVATE_KEY:}
app.jwt.public-key=${JWT_PUBLIC_KEY:}
# Access Token 效期：15 分鐘（毫秒），故意設短，外洩時風險視窗小
app.jwt.access-token-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
# Refresh Token 效期：7 天（毫秒），過期後要重新登入
app.jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Redis 設定：本機開發預設連本機的 6379 埠，正式部署時用環境變數蓋掉
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# 商品上傳附件：檔案大小限制（附件內容直接存進資料庫 BLOB，不再需要本機存放目錄）
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
